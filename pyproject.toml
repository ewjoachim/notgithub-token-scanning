[project]
name = "notgithub-token-scanning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joachim Jablon", email = "ewjoachim@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

# The app is a single main.py at the repo root served by uvicorn, not an
# installable package, so uv only needs to resolve the dependencies.
[tool.uv]
package = false

[dependency-groups]
dev = ["ruff", "basedpyright", "zizmor", "prek"]

[tool.basedpyright]
typeCheckingMode = "standard"
# Setting `exclude` replaces the defaults rather than adding to them, so these
# are basedpyright's own — without them it walks .venv.
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]

[tool.ruff]
unsafe-fixes = true

[tool.ruff.lint]
# Enable ruff features:
# E  => pycodestyle (errors), enabled in ruff default configuration
# W  => pycodestyle (warnings)
# F  => pyflakes, enabled in ruff default configuration
# I  => isort
# UP => pyupgrade
# PL => pylint
# T10 replaces the debug-statements hook, which prek has no builtin for
select = ["UP", "E", "F", "W", "PL", "I", "TID", "T10"]
ignore = [
    "E501",    # "Line too long"
    "PLR2004", # "Magic value used in comparison"
    "PLR0913", # "Too many arguments to function call"
    "PLR0911", # "Too many return statements"
    "PLR0912", # "Too many branches"
    "PLR0915", # "Too many statements"
    "PLW2901", # "Redefined loop name"
    "PLR5501", # "Use elif instead of if"
    "PLW0603", # "Global statement"
    "PLW1508", # "Invalid-envvar-default"
]
